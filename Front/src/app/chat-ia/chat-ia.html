<div class="chat-container">

  <header class="chat-header">
    <h2>Assistant IA</h2>
    <p>Posez une question sur votre base de connaissances.</p>
  </header>


  <div class="chat-body">

    <div class="chat-input">

      <textarea
        rows="4"
        placeholder="Posez votre question..."
        [(ngModel)]="question">
      </textarea>

      <button
        type="button"
        (click)="demanderConnaissance()"
        [disabled]="loadReponse">

        @if (loadReponse) {
          <span class="spinner"></span>
          Génération...
        } @else {
          Envoyer
        }

      </button>

    </div>


    @if (reponse()) {

      <div class="answer">

        <h3>Réponse</h3>

        <p>{{ reponse() }}</p>

      </div>

    }

  </div>

</div>
